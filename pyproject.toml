[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text2glioma"
version = "0.2.0"
description = "Text- and mask-conditioned 3D latent diffusion for synthetic multi-sequence glioma MRI generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Nikitas Koussis"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "einops",
    "accelerate",
    "diffusers",
    "ftfy",
    "gdown",
    "matplotlib",
    "monai>=1.0.0",
    "monai-generative",
    "nibabel",
    "numpy",
    "pandas",
    "pillow",
    "psutil",
    "pydicom",
    "PyYAML",
    "regex",
    "safetensors",
    "scikit-learn",
    "scikit-image",
    "scipy",
    "seaborn<=0.13.2",
    "tensorboard",
    "torch>=1.10.0",
    "torchvision",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
eval = ["torchmetrics", "bert-score", "open-clip-torch"]
gpu-monitor = ["pynvml", "pynvml-utils"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser", "sphinx-autodoc-typehints"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/nk233/text2glioma"
Documentation = "https://text2glioma.readthedocs.io"
Repository = "https://github.com/nk233/text2glioma"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"text2glioma.preprocessing" = ["atlas_masks/*.nii.gz"]

[project.scripts]
train_stage1 = "text2glioma.training.train_stage1:main"
train_stage2 = "text2glioma.training.train_stage2:main"
convert_dataset = "text2glioma.preprocessing.data_conversion:main"
sample = "text2glioma.inference.sampler:main"
create_prompts = "text2glioma.preprocessing.create_text:main"
train_stage1_ddp = "text2glioma.training.train_stage1_ddp:main"
train_stage2_ddp = "text2glioma.training.train_stage2_ddp:main"
text2glioma-validate = "text2glioma.validation.run_validation:main"