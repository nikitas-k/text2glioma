[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text2glioma"
version = "0.1.0"
description = "Generate text prompts from glioma segmentation labels"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "torch",
    "torchvision",
    "torchmetrics",
    "bert-score",
    "open-clip-torch",
    "pillow",
    "PyYAML",
]

[project.scripts]
text2glioma = "src.cli:main"
localise-train = "src.localisation_cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
