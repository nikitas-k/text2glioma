[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text2glioma"
version = "0.1.0"
description = "Generate text prompts from glioma segmentation labels"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "torchmetrics",
    "bert-score",
    "open-clip-torch",
    "pillow",
    "PyYAML",
    "torch>=1.10.0",
    "torchvision",
    "monai>=1.0.0",
    "monai-generative",
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
    "matplotlib",
    "tensorboard",
    "pydicom",
    "nibabel",
    "gdown",
    "PyYAML",
    "transformers",
    "diffusers",
    "ftfy",
    "regex",
    "scipy",
    "einops",
    "accelerate",
    "safetensors",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
train_stage1 = "text2glioma.training.train_stage1:__main__"
train_stage2 = "text2glioma.training.train_stage2:__main__"