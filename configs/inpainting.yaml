# Inpainting LDM config (Paper B — BraTS-GLI 2025 longitudinal pairs)
#
# Categorical-only conditioning: trajectory + treatment_a + treatment_b.
# No text encoder; the UNet's cross-attention attends to a length-3 token
# sequence produced by CategoricalConditioningEncoder.
#
# Channel layout (auto-aligned at startup based on the Stage-1 checkpoint;
# the values below are placeholders for an in_channels=4, latent_channels=6
# Stage-1 — the kl=1e-6 over-fitted VAE):
#   UNet in_channels  = 2 * latent_ch + 1  = 13   (noisy_z_b + z_masked_a + z_mask)
#   UNet out_channels = latent_ch          =  6   (v / epsilon)
#
# train_inpainting_ddp.py probes Stage-1 with one batch at startup and
# rewrites in_channels / out_channels / latent_channels if the checkpoint
# differs from the YAML — so these values are "best-effort defaults" only.

model:
  name: "DiffusionModelUNet"
  base_lr: 0.0001
  latent_channels: 6
  params:
    spatial_dims: 3
    in_channels: 13
    out_channels: 6
    num_res_blocks: 2
    num_channels: [256, 512, 768]
    attention_levels: [false, true, true]
    with_conditioning: true
    resblock_updown: true
    cross_attention_dim: 256          # MUST match cond encoder embed_dim
    num_head_channels: [0, 64, 64]
    upcast_attention: true
    use_flash_attention: false
    transformer_num_layers: 1
    norm_num_groups: 32
    norm_eps: 1.0e-6

scheduler:
  name: "DDIMScheduler"
  params:
    schedule: "scaled_linear_beta"
    num_train_timesteps: 1000
    beta_start: 0.0015
    beta_end: 0.0205
    prediction_type: "v_prediction"
    clip_sample: false                # latents have std≈1; clipping destroys signal

# Classifier-free guidance dropout (training-time)
cfg:
  p_traj: 0.20                        # drop trajectory token to NULL with p=0.2
  p_treat: 0.20                       # drop both treatment tokens jointly (see conditioning.py)

# Loss configuration
loss:
  mask_weight: 4.0                    # in-mask voxels weighted (1 + 4) = 5× the gradient

# Data
data:
  spatial_size: [160, 224, 160]
