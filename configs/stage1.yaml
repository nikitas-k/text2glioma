model:
  name: "AutoencoderKL"
  lr: 0.00005
  # Overfit profile: prioritise exact reconstruction over latent regularisation.
  perceptual_weight: 0.25
  adv_weight: 0.0
  # NOTE: kl_weight < 1e-6 causes encoder to memorize a fixed centered template
  # on registered, center-cropped data. Confirmed via decoder_prior_probe on
  # stage1_overfit_ablate_kl1e6 (kl=1e-6 alone, full attention stack on)
  # — b_mean shows no miniature template and per-subject reconstructions
  # remain anatomically distinct. Attention is not causal to the artifact.
  kl_weight: 0.000001
  l1_weight: 2.0
  grad_accum_steps: 8
  autoencoder_warm_up_n_epochs: 0   # train G alone for this many epochs before enabling D
  r1_gamma: 0.0                     # R1 gradient penalty weight (0 = disabled; try 1.0-10.0)
  kl_warmup_epochs: 0               # linearly ramp kl_weight from 0 over this many epochs (0 = disabled)
  kl_max: 0.0                       # clamp per-batch KL to this value (0 = disabled; try 1e4-1e5)
  tumor_weight: 1.0                 # >1.0 upweights L1 inside tumor (label > 0); requires 'label' in datalist
  adaptive_adv_weight: false        # keep off for pure reconstruction objective
  #wavelet_loss_weight: 1.0          # reinforce fine detail / high-frequency recovery
  #wavelet_detail_weight: 4.0        # stronger high-freq emphasis for detail retention
  #wavelet_name: "haar"              # pywt wavelet family: haar, db2, db4, sym4, coif1, …
  params:
    spatial_dims: 3
    in_channels: 4             # T1, T1CE, T2, FLAIR
    out_channels: 4
    num_channels: [96, 192, 384, 512]
    latent_channels: 6       # must match UNet in stage 2 config
    num_res_blocks: 2
    attention_levels: [False, False, False, True]
    with_encoder_nonlocal_attn: True
    with_decoder_nonlocal_attn: True
    use_flash_attention: True

# Channel ordering convention:
#   0: T1w
#   1: T1w post-contrast (T1CE)
#   2: T2w
#   3: FLAIR
image_keys: ["t1", "t1ce", "t2", "flair"]

discriminator:
  lr: 0.0001
  spectral_norm: false        # wrap D conv layers with spectral norm (anti-grid artifact)
  n_scales: 1                 # multi-scale D: 1 = single (default), 2 = two scales (orig + 2× pooled)
  params:
    spatial_dims: 3
    num_channels: 96
    num_layers_d: 3
    in_channels: 4             # matches VAE output channels

perceptual_network:
  params:
    spatial_dims: 3
    network_type: "medicalnet_resnet50_23datasets"
    is_fake_3d: False
    # NOTE: MedicalNet expects 1-channel input; perceptual loss is
    # computed per-channel and averaged in training_functions.py