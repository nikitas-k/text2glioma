densenet:
  name: densenet121
  pretrained: false
  num_classes: 2
  in_channels: 1
  dropout_rate: 0.2
  spatial_dims: 3
  progress: true
  out_features: null
  features_only: false
  feature_size: 64
  feature_stride: 4
  feature_out_channels: [64, 128, 256, 512]
  feature_reduction: true
  feature_pool: "avg"
  input_shape: [1, 160, 192, 160]
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 2
  num_epochs: 1000
  val_interval: 10
  early_stopping: 50
  
