# ── Pinaya VAE fine-tuning config (decoder-only strategy) ──────────
# Architecture matches the pretrained Pinaya 2022 brain VAE exactly:
#   - 1-channel in/out (each BraTS modality processed independently)
#   - num_channels: [64, 128, 128, 128]  (4 downsample levels)
#   - No attention, no nonlocal attention
#   - latent_channels: 3
#
# Fine-tuning hyperparameters:
#   - Low LR (1e-5) to preserve pretrained features
#   - Low adversarial weight — we want reconstruction fidelity
#   - No KL warmup (pretrained latent space already structured)
#   - No L2-SP (it pulls the decoder back to its pretrained prior)
#   - D enabled from step 0 to preserve sharp detail
#   - D lr = G lr to prevent D dominance

model:
  name: "AutoencoderKL"
  lr: 0.00001                        # 5× lower than scratch training (5e-5)
  l1_weight: 0.3                     # midpoint between v3 (0.1, too weak →
                                     # reversion) and 0.5 (risks smoothing out
                                     # gyrification detail).  Should anchor BraTS
                                     # reconstruction without L1-dominant blur.
  perceptual_weight: 1.0
  adv_weight: 0.025                  # midpoint between v3 (0.05, D dominated)
                                     # and 0.01.  Meaningful sharpness signal
                                     # without overwhelming reconstruction.
  kl_weight: 0.00000001              # match Pinaya's original kl_weight
  autoencoder_warm_up_n_epochs: 0    # D from step 0 — preserves fine detail
                                     # that L1 would smooth out during warmup.
  r1_gamma: 0.0
  kl_warmup_epochs: 0
  kl_max: 0.0
  adaptive_adv_weight: false         # MUST be false: adaptive weight + gradient
                                     # checkpointing triggers 3× recomputation
                                     # (two retain_graph autograd.grad calls in
                                     # _compute_adaptive_weight + final backward),
                                     # OOMs on H200 140GB at bs=1.
  l2sp_weight: 0.0                   # DISABLED.  L2-SP explicitly pulls weights
                                     # back toward the pretrained Pinaya decoder,
                                     # which was trained on UK Biobank T1w.  In v3
                                     # this caused the decoder to revert to its
                                     # prior (hallucinating cortical gyrification
                                     # onto smooth pathological tissue), undoing
                                     # the BraTS adaptation.  SSIM fell from 0.808
                                     # (epoch 3.5) to 0.627 (epoch 11.5).
  wavelet_loss_weight: 0.0
  wavelet_detail_weight: 2.0
  wavelet_name: "haar"
  grad_accum_steps: 4                # effective bs = 1 × 4 GPUs × 4 accum = 16
  conditional_disc: false             # pix2pix-style conditional D: broken for
                                     # same-domain reconstruction (D learns trivial
                                     # pixel-identity check).  Keep false.
  lr_scheduler: "constant"           # "constant" or "cosine".  Cosine annealing
                                     # prevents late-stage D dominance by decaying
                                     # both G and D learning rates to eta_min.
  eta_min_g: 0.0                     # G minimum LR for cosine schedule
  params:
    spatial_dims: 3
    in_channels: 1                   # Pinaya architecture: single-channel
    out_channels: 1
    num_channels: [64, 128, 128, 128]
    latent_channels: 3
    num_res_blocks: 2
    norm_num_groups: 32
    norm_eps: 0.000001
    attention_levels: [False, False, False, False]
    with_encoder_nonlocal_attn: False
    with_decoder_nonlocal_attn: False

# Channel ordering convention (handled by PerChannelVAEWrapper):
#   0: T1w
#   1: T1w post-contrast (T1CE)
#   2: T2w
#   3: FLAIR
image_keys: ["t1", "t1ce", "t2", "flair"]

discriminator:
  lr: 0.00001                        # same as G lr — v3 used 5× G lr which
                                     # let D win the arms race (d_loss→0.05).
  eta_min_d: 0.0                     # D minimum LR for cosine schedule
  spectral_norm: false
  n_scales: 1
  params:
    spatial_dims: 3
    num_channels: 64                  # lighter D for fine-tuning
    num_layers_d: 2                   # fewer layers — we're not training from scratch
    in_channels: 4                    # operates on concatenated 4-ch output

perceptual_network:
  params:
    spatial_dims: 3
    network_type: "medicalnet_resnet50_23datasets"
    is_fake_3d: False
