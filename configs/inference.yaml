guidance_scale_text: 7.5
guidance_scale_mask: 3.0
num_steps: 50
# Dimensions for 3D generation (depth, height, width)
depth: 80
height: 112
width: 128
scale_factor: 0.18215

# Mask conditioning
num_mask_classes: 4
# Set to "" or omit to run mask-unconditionally (text-only)
mask_field: "label"

# Optional prompt describing a healthy baseline image
healthy_prompt: "a healthy brain MRI"
# Threshold for highlighting the difference map
difference_threshold: 0.0
# When true, save the thresholded difference tensor to disk
save_difference: false
