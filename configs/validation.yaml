# Validation pipeline configuration
# Usage: text2glioma-validate --config configs/validation.yaml

# ========================================================================
# Paths (override via CLI or env vars)
# ========================================================================
paths:
  real_dir: ./data/brats/imagesTr          # real 4-ch NIfTI volumes
  real_label_dir: ./data/brats/labelsTr    # real segmentation masks
  synth_dir: ./outputs/synth_volumes       # synthetic 4-ch NIfTI volumes
  synth_label_dir: ./outputs/synth_labels  # round-trip segmentation labels
  prompts_json: ./data/prompts.json        # text prompts for CLIP scoring
  atlas_dir: ./data/atlases                # atlas masks for VASARI extraction
  datalist_dir: ./data/datalists           # datalist_<task>.json for downstream
  cnn_config: ./configs/cnn.yaml           # DenseNet classifier config
  ldm_config: ./configs/ldm.yaml           # LDM config (for ablation)
  stage1_config: ./configs/stage1.yaml     # VAE config
  stage1_uri: ""                           # pretrained VAE checkpoint
  model_ckpt: ""                           # LDM checkpoint
  source_json: ./data/prompts.json         # prompts for sample generation
  output_dir: ./outputs/validation         # where to write results

# ========================================================================
# Global
# ========================================================================
device: cuda
seed: 42
max_n: null  # limit samples for quick testing (null = use all)

# ========================================================================
# §1 — Image quality
# ========================================================================
image_quality:
  enabled: true
  output_json: ${paths.output_dir}/image_quality.json

# ========================================================================
# §2 — Mask fidelity
# ========================================================================
mask_fidelity:
  enabled: true
  segmenter_bundle: brats_mri_segmentation
  output_json: ${paths.output_dir}/mask_fidelity.json

# ========================================================================
# §3 — Text alignment
# ========================================================================
text_alignment:
  enabled: true
  enhancing_label: 3
  nonenhancing_label: 2
  oedema_label: 1
  output_json: ${paths.output_dir}/text_alignment.json

# ========================================================================
# §4 — Downstream utility
# ========================================================================
downstream_utility:
  enabled: false   # typically run separately (long)
  tasks: [mgmt, 1p19q, idh, grade]
  regimes: [real_only, synth_only, augmented_50_50, augmented_25_75, low_data]
  seeds: [0, 1, 2]
  n_epochs: 200
  val_interval: 10
  output_json: ${paths.output_dir}/downstream.json

# ========================================================================
# §5 — Ablation studies
# ========================================================================
ablation:
  guidance_sweep:
    enabled: false
    n_samples: 50
    ddim_steps: 50
    output_json: ${paths.output_dir}/guidance_sweep.json
  conditioning_ablation:
    enabled: false
    n_samples: 50
    ddim_steps: 50
    output_json: ${paths.output_dir}/conditioning_ablation.json
  steps_sweep:
    enabled: false
    n_samples: 50
    gs_text: 7.5
    gs_mask: 3.0
    output_json: ${paths.output_dir}/steps_sweep.json
  dropout:
    enabled: false
    output_dir: ${paths.output_dir}/dropout_configs

# ========================================================================
# §6 — Diversity & memorisation
# ========================================================================
diversity:
  enabled: true
  prompt_dirs: null  # dict of prompt_id → dir, or null to skip intra-prompt
  output_json: ${paths.output_dir}/diversity.json

# ========================================================================
# §7 — Radiologist evaluation
# ========================================================================
radiologist_eval:
  turing_test:
    enabled: false
    n_each: 50
    channels: [1, 3]   # T1CE + FLAIR
    output_dir: ${paths.output_dir}/turing_test
  quality_rating:
    enabled: false
    n_samples: 50
    channels: [1, 3]
    output_dir: ${paths.output_dir}/quality_rating
